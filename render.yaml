services:
  - type: web
    name: sentinel-x
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        sync: false

      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: SESSION_STRING
        sync: false

      - key: PORT
        value: "10000"